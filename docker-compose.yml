# Phase 5: Redis Stack (RediSearch) for the semantic cache.
# Phase 9: Postgres + pgvector as the production vector/relational store.
#   docker compose up -d              # start both
#   docker compose up -d redis        # cache only (pgvector is optional: the
#                                       chroma/sqlite backends still work)
#   docker compose down               # stop
services:
  redis:
    image: redis/redis-stack:7.4.0-v3   # Redis + RediSearch (vector search) + RedisInsight
    container_name: prod-rag-redis
    ports:
      - "6380:6379"      # host 6380 → redis (6379 often taken by another project's redis)
      - "8002:8001"      # RedisInsight UI (optional, http://localhost:8002)
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # Vectors (pgvector) + the operational tables that SQLite held through Phase 8.
  postgres:
    image: pgvector/pgvector:pg17   # stock Postgres 17 with the vector extension
    container_name: prod-rag-postgres
    environment:
      POSTGRES_USER: rag
      POSTGRES_PASSWORD: rag
      POSTGRES_DB: rag
    ports:
      - "5433:5432"      # host 5433 → postgres (5432 is often taken by a local install)
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rag -d rag"]
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  redis-data:
  postgres-data:
