# Production RAG — application configuration (non-secret).
# Secrets (OPENAI_API_KEY, etc.) live in .env, never here.
# Thresholds/models/paths are config-driven: change here, not in code.

app:
  name: production-rag
  environment: development        # development | staging | production
  log_level: INFO                 # DEBUG | INFO | WARNING | ERROR

cors:                             # Phase 8: browser access for the Next.js frontend
  enabled: true
  allow_origins: ["http://localhost:3000", "http://127.0.0.1:3000"]
  allow_credentials: true
  allow_methods: ["*"]
  allow_headers: ["*"]

paths:
  data_dir: data
  chroma_dir: data/chroma
  sqlite_path: data/audit/app.sqlite
  bm25_dir: data/bm25_index

models:
  # OpenAI API — no CPU cost, no local weights. Switch provider back to `local` with
  # the bge settings below to run offline (changing either way needs a re-ingest:
  # the vector width changes, so old chunks and cache entries are unusable).
  embedding:
    provider: openai            # openai | local
    name: text-embedding-3-small
    dimensions: 1536            # v3 native width; may be shortened (e.g. 512) — must match the store
    device: cpu                 # local provider only
    query_prefix: ""            # bge wants an instruction prefix; OpenAI does not
    batch_size: 64              # inputs per API request
    normalize: true
    # Local alternative:
    #   provider: local
    #   name: BAAI/bge-base-en-v1.5   # bge-base=768, bge-small=384, bge-large=1024
    #   dimensions: 768
    #   query_prefix: "Represent this sentence for searching relevant passages: "

  # Local cross-encoder; used from Phase 2 (second-pass precision).
  reranker:
    provider: local
    name: cross-encoder/ms-marco-MiniLM-L-6-v2
    device: cpu

  # Final grounded answer. API only.
  generation:
    provider: openai
    name: gpt-4o-mini      # cheaper answers for eval/dev; bump to gpt-4o for best quality
    temperature: 0.1
    max_tokens: 1000
    timeout: 30

  # Citation verification / eval labeling. Configurable (openai | ollama).
  judge:
    provider: openai
    name: gpt-4o-mini
    temperature: 0.0

  # Conversation naming (one ~30-token call per new chat). enabled: false = trimmed question.
  title:
    enabled: true
    provider: openai
    name: gpt-4o-mini
    temperature: 0.3
    max_words: 5
    max_tokens: 48
    max_chars: 60

# Phase 9: where vectors and operational rows live. Both are pluggable — chroma +
# sqlite needs no infrastructure (tests, laptop), pgvector + postgres is the
# production pair (docker compose up -d postgres). Switching the vector store
# requires a re-ingest: the vectors themselves are not copied between engines
# except by scripts/migrate_to_postgres.py.
stores:
  vector: chroma              # chroma | pgvector
  relational: sqlite          # sqlite | postgres
  postgres:
    dsn: postgresql://rag:rag@localhost:5433/rag   # override with POSTGRES_DSN in .env
    chunks_table: chunks
    hnsw_m: 16                # graph degree; higher = better recall, slower build
    hnsw_ef_construction: 64  # build-time candidate list
    min_pool_size: 1
    max_pool_size: 5

retrieval:
  default_top_k: 5              # final chunks handed to generation
  mode: hybrid                  # hybrid (dense+BM25+RRF+rerank) | dense (Phase 1 path). Per-request override via AskRequest.mode
  structured_confidence_from_dense: true  # CSV/JSON/XML score ~0 on the cross-encoder → use cosine
  identifier_match_confidence: 0.95       # exact record-id match beats any similarity score
  dense_candidates: 20          # dense pool size before fusion
  sparse_candidates: 20         # BM25 pool size before fusion
  rrf_k: 60                     # Reciprocal Rank Fusion damping constant
  dense_weight: 1.0             # RRF weight for dense ranking
  sparse_weight: 1.0            # RRF weight for BM25 ranking
  rerank_candidates: 20         # fused candidates rescored by the cross-encoder

ingestion:
  corpus:
    dir: data/corpus            # default source for /v1/ingest (populate via scripts/fetch_corpus.py)
  formats:
    enabled: [markdown, txt, html, pdf, docx, image, csv, json, xml]   # accepted file types
    pdf:
      scanned_text_density_threshold: 100   # chars/page below this → treat page as scanned (OCR'd via M4)
    ocr:                          # OCR runs only for image files + scanned PDF pages
      enabled: true               # false/unavailable → scanned content skipped gracefully (never crashes)
      engine: easyocr             # easyocr (no system binary, ~90MB models on first use) | tesseract
      languages: [en]
      dpi: 200                    # render resolution for scanned PDF pages before OCR
    csv:                          # csv/json/xml use the 'structured' chunker (one record per chunk)
      rows_per_chunk: 20          # data rows grouped into one block (header prepended for context)
    json:                         # structure-aware: descend until each record fits
      max_record_tokens: 400      # a node bigger than this is split by key/element
      max_depth: 6                # guard against pathological nesting
      extract_fields: true        # lift a record's scalar fields into chunk metadata
      max_fields: 16              # cap per record (metadata must stay flat scalars)
      max_field_chars: 120        # longer values are not useful to filter on
      id_keys: [id, _id, uid, uuid, code, mrn, number, key]   # first match -> record_id
  chunking:
    strategy: recursive         # recursive (by headers) | fixed (token windows) | semantic (embedding-based)
    max_chunk_tokens: 512
    overlap_tokens: 64
    min_chunk_chars: 40
    semantic_threshold: 0.6     # cosine sim below which the semantic chunker starts a new chunk

quality:                        # Phase 3: citation verification + composite confidence + graceful IDK
  verify_citations: true        # run the LLM judge over citations (false = skip, saves cost)
  idk_threshold: 0.45           # composite confidence below this → graceful "I don't know"
  confidence_weights:           # how the 3 signals combine into the composite score (should sum to 1.0)
    retrieval: 0.4              # Phase 2 retrieval confidence
    citation: 0.4              # fraction of citations the judge supports
    self: 0.2                  # model's own self-reported confidence

eval:                           # Phase 4: evaluation harness (the regression gate)
  golden_path: eval/golden_set.jsonl   # human-authored answer key (git-tracked)
  retrieval_k: 5                # top_k used when answering eval questions
  regression_tolerance: 0.03    # overall-score drop beyond this counts as a regression
  strategies: [recursive, fixed, semantic]   # chunkers compared by the benchmark

autoeval:                       # Phase 6: capture weak answers → reviewable eval candidates
  enabled: true
  flag_confidence_threshold: 0.6  # composite confidence below this enqueues a candidate
  capture_idk: true               # also capture graceful "I don't know" answers
  dedup_threshold: 0.92           # question sim >= this to an existing golden case → duplicate
  agreement_threshold: 0.85       # double-run draft answers sim >= this → runs agree
  candidates_path: eval/candidates.jsonl   # approved drafts appended here (separate from golden set)

cache:                          # Phase 5: semantic cache (Redis Stack / RediSearch)
  enabled: true                 # false, or Redis down → pipeline runs normally, no cache
  redis_url: redis://localhost:6380   # docker-compose maps redis-stack to host 6380
  threshold: 0.90               # cosine sim >= this → cache HIT (bge paraphrases ~0.90-0.94; unrelated ~0.47)
  near_miss_margin: 0.10        # sim in [0.80, 0.90) logged as near-miss, NOT served
  ttl_seconds: 86400            # cached entry lifetime (1 day)
  index_name: rag_cache_idx
  key_prefix: "cache:"
  cost_per_answer_usd: 0.002    # estimate used for the cost-saved metric
